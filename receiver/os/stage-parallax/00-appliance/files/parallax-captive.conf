# Parallax OS captive portal: while NetworkManager runs a SHARED connection (the Parallax-Setup
# hotspot), its dnsmasq instance resolves every name to the AP address, so phones' connectivity
# probes land on the daemon and trigger the setup sheet. This file only applies to shared-mode
# dnsmasq (dnsmasq-shared.d) — normal client networking is untouched.
address=/#/10.42.0.1
