name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.x

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-

      - name: Install Linux native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libasound2-dev rpm

      - name: Install dependencies
        run: npm ci

      - name: Validate media binaries and fallback playback
        run: npm run check:media-binaries

      - name: Build native modules
        run: npm run rebuild:native

      - name: Verify native module exists
        shell: bash
        run: |
          if [ ! -f native/build/Release/visualizer_dsp.node ]; then
            echo "ERROR: native DSP module was not built!"
            exit 1
          fi
          echo "Native module built successfully: $(ls -lh native/build/Release/visualizer_dsp.node)"

      - name: Typecheck
        run: npm run typecheck

      - name: Test native playback state machine
        run: npm run test:native-playback

      - name: Test native DSP contracts
        run: npm run test:native-dsp

      - name: Test
        run: npm test

      - name: Validate packaging config
        run: npm run check:packaging-config

      - name: Build project
        run: npm run build

  build-smoke:
    name: Build Smoke (${{ matrix.os }}, ${{ matrix.arch }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: quality-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            dist_cmd: dist:linux
          - os: ubuntu-24.04-arm
            arch: arm64
            dist_cmd: dist:linux
          - os: macos-15
            arch: arm64
            dist_cmd: dist:mac
          - os: macos-15-intel
            arch: x64
            dist_cmd: dist:mac
          - os: windows-2022
            arch: x64
            dist_cmd: dist:win

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-

      - name: Install Linux native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libasound2-dev rpm

      - name: Install dependencies
        run: npm ci

      - name: Validate media binaries and fallback playback
        run: npm run check:media-binaries

      - name: Build native modules
        run: npm run rebuild:native

      - name: Verify native module exists
        shell: bash
        run: |
          if [ ! -f native/build/Release/visualizer_dsp.node ]; then
            echo "ERROR: native DSP module was not built!"
            exit 1
          fi
          echo "Native module built successfully: $(ls -lh native/build/Release/visualizer_dsp.node)"

      - name: Test native playback state machine
        run: npm run test:native-playback

      - name: Test native DSP contracts
        run: npm run test:native-dsp

      - name: Validate packaging config
        run: npm run check:packaging-config

      - name: Package smoke build (validates shipped binaries and native addons)
        run: npm run ${{ matrix.dist_cmd }} -- --${{ matrix.arch }} --dir
