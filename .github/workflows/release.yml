name: Build Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version label for the build (e.g. alpha-1, beta-2)'
        required: false
        default: ''

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist_cmd: dist:linux
          - os: macos-latest
            dist_cmd: dist:mac
          - os: windows-latest
            dist_cmd: dist:win

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-cache

      - name: Install dependencies
        run: npm ci

      - name: Install Linux native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libasound2-dev

      - name: Build native DSP module
        run: npm run rebuild:native

      - name: Verify native module exists
        shell: bash
        run: |
          if [ ! -f native/build/Release/visualizer_dsp.node ]; then
            echo "ERROR: native DSP module was not built!"
            exit 1
          fi
          echo "Native module built successfully: $(ls -lh native/build/Release/visualizer_dsp.node)"

      - name: Write Last.fm credentials file
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
        run: |
          node -e 'const fs=require("fs"); const key=process.env.LASTFM_API_KEY ?? ""; const secret=process.env.LASTFM_SHARED_SECRET ?? ""; fs.writeFileSync(".env.local", `LASTFM_API_KEY=${key}\nLASTFM_SHARED_SECRET=${secret}\n`, "utf8")'

      - name: Install macOS DMG tool
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 -m pip install --user dmgbuild
          DMGBUILD_PATH="$(python3 - <<'PY'
          import site
          print(f"{site.USER_BASE}/bin/dmgbuild")
          PY
          )"
          if [ ! -x "$DMGBUILD_PATH" ]; then
            echo "ERROR: dmgbuild was installed, but the executable was not found at $DMGBUILD_PATH"
            exit 1
          fi
          echo "CUSTOM_DMGBUILD_PATH=$DMGBUILD_PATH" >> "$GITHUB_ENV"

      - name: Build distributable
        run: npm run ${{ matrix.dist_cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astra-${{ runner.os }}${{ inputs.version_tag && format('-{0}', inputs.version_tag) || '' }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 30
